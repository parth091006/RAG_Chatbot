[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Advanced Retrieval-Augmented Generation Research Assistant"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.2.0",
    "sentence-transformers>=2.7.0",
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
    "httpx>=0.27.0,<0.28",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.5.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]